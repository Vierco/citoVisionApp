[versions]
agp = "9.2.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
# Kotlin del proyecto. Subido a 2.2.20 (ADR-0005): Compose MP 1.10.3 exige >= 2.2.20 para targets native
# (enlazado de iOS). Antes fijaba 2.1.0 nominal, pero el compilador efectivo era 2.2.10 (lo traía AGP).
kotlin = "2.2.20"
composeBom = "2026.02.01"
ktlintGradle = "14.2.0"
detekt = "1.23.8"
compose-multiplatform = "1.10.3"
# Koin 4.1.0 (ADR-0005): `koinViewModel()` es una función INLINE, así que la referencia al símbolo de
# `LocalViewModelStoreOwner` se incrusta en nuestro código al compilar. Koin 4.0.0 se compiló contra
# lifecycle-viewmodel-compose 2.8.0 y 4.1.0 contra 2.9.x; con lifecycle 2.10.0 el símbolo de 2.8.0 ya no
# existe → en iOS (enlazado duro de Native) fallaba `Undefined symbol ...LocalViewModelStoreOwner
# $stableprop_getter$artificial`. En JVM (Android/Desktop) se toleraba, por eso solo rompía iOS.
koin = "4.1.0"
ktor = "3.0.1"
napier = "2.7.1"
datastore = "1.1.1"
jetbrains-lifecycle = "2.10.0"
jetbrains-navigation = "2.9.2"
coroutines = "1.9.0"
firebase-kmp = "2.1.0"
firebase-bom = "33.15.0"
google-services = "4.4.3"
androidx-credentials = "1.3.0"
google-identity-googleid = "1.1.1"
# Mokkery 2.10.2: soporta Kotlin 2.2.0–2.2.21 (la 2.9.0 solo llegaba a 2.2.10). Es plugin de compilador →
# debe casar con el Kotlin del proyecto (2.2.20, ADR-0005). Solo afecta a tests (commonTest).
mokkery = "2.10.2"
# FileKit 0.11.0: klib compilado con Kotlin 2.2.10. El compilador del proyecto es ahora 2.2.20 (ADR-0005) y
# lee klibs iguales o más antiguos (dirección segura), así que 0.11.0 va sobrado. Cuidado al subir librerías
# a klibs compilados con Kotlin > 2.2.20 (el compilador 2.2 no lee metadata futura, ver Coil abajo).
# Coil 3.3.0: última compilada con Kotlin <= 2.2.x. La 3.4.0 usa 2.3.0 (justo en el límite legible por
# el compilador 2.2) y la 3.5.0 usa 2.4.0 → rechazo de metadata "actual 2.4.0, compilador lee hasta 2.3.0".
filekit = "0.11.0"
coil = "3.3.0"
# Persistencia (SPEC-0004). KSP DEBE casar con el Kotlin del proyecto: ahora 2.2.20 (ADR-0005; el catálogo
# fija `kotlin = "2.2.20"`). Room 2.8.4 no fija stdlib → seguro con 2.2.20.
# kotlinx-datetime 0.7.1: NO bajar a 0.6.2. `org.jetbrains.compose.material3:material3` (el artefacto que
# usa Desktop, no Android) exige 0.7.1; con 0.6.2 el runtime de Desktop rompe. En 0.7.x `Instant` y `Clock`
# son typealias de `kotlin.time.*` (ya presentes en el stdlib 2.2.20), por eso se importan desde kotlin.time.
room = "2.8.4"
androidx-sqlite = "2.6.2"
ksp = "2.2.20-2.0.4"
# Cobertura de tests (TESTING.md §2). Kover es el oficial de JetBrains y entiende KMP; solo instrumenta los
# targets JVM (Android + Desktop), así que los tests de iOS no cuentan en el informe.
kover = "0.9.9"
kotlinx-datetime = "0.7.1"
# Inferencia on-device (SPEC-0006 / ADR-0003). Java/JNI puro (sin metadata Kotlin → sin límite de compilador).
# `onnxruntime-android` (AAR) para Android; `onnxruntime` (JVM, con nativos win/linux/macOS) para Desktop.
# NO bajar de 1.22.0: hasta 1.21.1 incluida, `libonnxruntime4j_jni.so` se publica con segmentos LOAD
# alineados a 4 KB, lo que incumple el requisito de páginas de 16 KB de Google Play (obligatorio desde
# nov-2025 para targetSdk >= 35). `libonnxruntime.so` ya venía a 16 KB; el que fallaba era el wrapper JNI.
onnxruntime = "1.22.0"

