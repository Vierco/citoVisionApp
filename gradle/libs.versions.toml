[versions]
agp = "9.2.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
kotlin = "2.1.0"
composeBom = "2026.02.01"
ktlintGradle = "14.2.0"
detekt = "1.23.8"
compose-multiplatform = "1.10.3"
koin = "4.0.0"
ktor = "3.0.1"
napier = "2.7.1"
datastore = "1.1.1"
jetbrains-lifecycle = "2.9.6"
jetbrains-navigation = "2.9.2"
coroutines = "1.9.0"
firebase-kmp = "2.1.0"
firebase-bom = "33.15.0"
google-services = "4.4.3"
androidx-credentials = "1.3.0"
google-identity-googleid = "1.1.1"
mokkery = "2.9.0"
# FileKit 0.11.0 se compila con Kotlin 2.2.10 (= compilador efectivo del proyecto); 0.12+ usa 2.2.20
# y arriesga rechazo de .klib (mismo problema que Firebase).
# Coil 3.3.0: última compilada con Kotlin <= 2.2.x. La 3.4.0 usa 2.3.0 (justo en el límite legible por
# el compilador 2.2) y la 3.5.0 usa 2.4.0 → rechazo de metadata "actual 2.4.0, compilador lee hasta 2.3.0".
filekit = "0.11.0"
coil = "3.3.0"
# Persistencia (SPEC-0004). KSP DEBE casar con el Kotlin efectivo del proyecto (2.2.10, el que trae AGP),
# no con el `kotlin = "2.1.0"` del catálogo. Room 2.8.4 no fija stdlib → seguro con 2.2.10.
# kotlinx-datetime 0.7.1: NO bajar a 0.6.2. `org.jetbrains.compose.material3:material3` (el artefacto que
# usa Desktop, no Android) exige 0.7.1; con 0.6.2 el runtime de Desktop rompe. En 0.7.x `Instant` y `Clock`
# son typealias de `kotlin.time.*` (ya presentes en el stdlib 2.2.10), por eso se importan desde kotlin.time.
room = "2.8.4"
androidx-sqlite = "2.6.2"
ksp = "2.2.10-2.0.2"
kotlinx-datetime = "0.7.1"

